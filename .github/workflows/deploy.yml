# 发布到 Maven Central（Central Publisher Portal）
# 需要在仓库 Secrets 中配置：
#   CENTRAL_TOKEN_USERNAME / CENTRAL_TOKEN_PASSWORD：在 https://central.sonatype.com 生成的 user token
#   GPG_SECRET：ASCII-armored 的 GPG 私钥
#   GPG_PASSWORD：GPG 私钥密码
name: Maven Central Repo Deployment
# 发布 release 之后触发
on:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git Repo
        uses: actions/checkout@v6

      # setup-java 会生成 settings.xml（server id=central）并导入 GPG 私钥
      - name: Set up JDK 8 and Maven Central credentials
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SECRET }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish to Maven Central Repo
        run: mvn -B clean deploy -P deploy -Dmaven.test.skip=true
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSWORD }}
